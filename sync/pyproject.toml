[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "acmrank-sync"
version = "0.1.0"
description = "Sync workers for ACMRank platform integrations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "curl-cffi>=0.10,<0.11",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
mypy_path = ["src"]
python_version = "3.13"
strict = true
