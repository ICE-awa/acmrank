name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - "chore-*"
      - "feature-*"
      - "fix-*"
      - "refactor-*"
      - "test-*"

jobs:
  server:
    name: server / ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: tidy module
            uses_golangci: false
            run: |
              go mod tidy
              git diff --exit-code
          - check_name: gofmt
            uses_golangci: false
            run: |
              go fmt ./...
              git diff --exit-code
          - check_name: go build
            uses_golangci: false
            run: go build ./...
          - check_name: go vet
            uses_golangci: false
            run: go vet ./...
          - check_name: go test
            uses_golangci: false
            run: go test ./...
          - check_name: go test -race
            uses_golangci: false
            run: go test -race ./...
          - check_name: golangci-lint
            uses_golangci: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Run server check
        if: ${{ !matrix.uses_golangci }}
        run: ${{ matrix.run }}

      - if: ${{ matrix.uses_golangci }}
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: server
          version: latest

  web:
    name: web / ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: formatting
            install_playwright: false
            run: pnpm format:check
          - check_name: lint
            install_playwright: false
            run: pnpm lint
          - check_name: typecheck
            install_playwright: false
            run: pnpm typecheck
          - check_name: unit tests
            install_playwright: false
            run: pnpm test:run
          - check_name: build
            install_playwright: false
            run: pnpm build
          - check_name: e2e tests
            install_playwright: true
            run: pnpm test:e2e
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: ${{ matrix.install_playwright }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run web check
        run: ${{ matrix.run }}

  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src

      - name: Pytest
        run: python -m pytest
